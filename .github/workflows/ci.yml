name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # ubuntu-latest ships shellcheck; install only if it is missing.
      - name: Ensure shellcheck
        run: shellcheck --version || (sudo apt-get update && sudo apt-get install -y shellcheck)

      # bash -n only syntax-checks its first file argument, so loop.
      - name: Syntax check (bash -n)
        run: |
          for f in install.sh uninstall.sh tools/*.sh tests/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck (-S warning)
        run: shellcheck -S warning install.sh uninstall.sh tools/*.sh tests/*.sh

      # Everything is mocked; the tests run unprivileged.
      - name: Run tests
        run: |
          for t in tests/*.sh; do
            echo "== $t =="
            bash "$t"
          done

      # Fail if a tracked file is missing from the "## Repository layout"
      # tree in README.md, so a new file cannot rot out of the diagram.
      - name: README repository-layout tree is current
        run: |
          tree=$(awk '/^## Repository layout/{f=1} f&&/^```/{n++; next} f&&n==1{print} n==2{exit}' README.md)
          fail=0
          for f in $(git ls-files); do
            re=$(basename "$f" | sed 's/[].[*^$]/\\&/g')
            if ! printf '%s\n' "$tree" | grep -qE "(^|[ /])${re}( |$)"; then
              echo "Missing from README '## Repository layout': $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "Update the tree in README.md."; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic

      # Compile-check only — the module is never loaded here.
      # KCFLAGS=-Werror turns any compiler warning into a failure.
      - name: Compile-check the module (-Werror)
        run: |
          KDIR=/lib/modules/$(ls /lib/modules | head -1)/build
          [ -d "$KDIR" ] || KDIR=$(ls -d /lib/modules/*/build | head -1)
          echo "Building against $KDIR"
          make KDIR="$KDIR" KCFLAGS=-Werror

  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install device-tree-compiler
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler

      # Errors fail the job; dtc warnings are allowed (dtc exits 0 on them).
      - name: Compile the device tree overlay
        run: dtc -@ -I dts -O dtb -o /tmp/x120x.dtbo x120x-overlay.dts

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install build deps + sparse
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic sparse

      # W=1 enables kernel extra-warning checks (incl. kernel-doc).  They do
      # not fail the build on their own, so grep the output and fail on any.
      # KCFLAGS=-Werror additionally turns compiler warnings into errors.
      - name: make W=1 (warnings fail)
        run: |
          KDIR=$(ls -d /lib/modules/*/build | sort -V | tail -1)
          echo "Building against $KDIR"
          make KDIR="$KDIR" W=1 KCFLAGS=-Werror 2>&1 | tee w1.log
          if grep -qiE 'warning' w1.log; then echo "W=1 produced warnings"; exit 1; fi

      # sparse prints findings but exits 0; fail on any on our source.
      - name: sparse (make C=1)
        run: |
          KDIR=$(ls -d /lib/modules/*/build | sort -V | tail -1)
          make KDIR="$KDIR" C=1 2>&1 | tee sparse.log
          if grep -qE 'x120x\.c.*(warning|error)' sparse.log; then echo "sparse findings"; exit 1; fi
